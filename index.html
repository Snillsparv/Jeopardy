<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeopardy!</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <!-- Header -->
        <header>
            <h1 class="game-title">JEOPARDY!</h1>
            <div class="round-indicator" id="roundIndicator">Omgång 1: Jeopardy</div>
        </header>

        <!-- Spelplan -->
        <div id="gameBoard" class="game-board"></div>

        <!-- Spelare -->
        <div class="players-section">
            <div class="player player-1" id="player1">
                <div class="player-name">Spelare 1</div>
                <div class="player-score">0 kr</div>
                <div class="player-buzzer">Tangent: 1</div>
            </div>
            <div class="player player-2" id="player2">
                <div class="player-name">Spelare 2</div>
                <div class="player-score">0 kr</div>
                <div class="player-buzzer">Tangent: 2</div>
            </div>
            <div class="player player-3" id="player3">
                <div class="player-name">Spelare 3</div>
                <div class="player-score">0 kr</div>
                <div class="player-buzzer">Tangent: 3</div>
            </div>
            <div class="player player-4" id="player4">
                <div class="player-name">Spelare 4</div>
                <div class="player-score">0 kr</div>
                <div class="player-buzzer">Tangent: 4</div>
            </div>
        </div>

        <!-- Frågemodal -->
        <div id="questionModal" class="modal hidden">
            <div class="modal-content">
                <div class="question-value" id="questionValue"></div>
                <div class="question-category" id="questionCategory"></div>
                <div class="question-text" id="questionText"></div>
                <div class="question-answer hidden" id="questionAnswer"></div>
                <div class="buzzer-status" id="buzzerStatus">Väntar på buzzer...</div>
                <div class="modal-buttons">
                    <button id="showAnswerBtn" class="btn">Visa svar</button>
                    <button id="correctBtn" class="btn btn-correct hidden">Rätt</button>
                    <button id="wrongBtn" class="btn btn-wrong hidden">Fel</button>
                    <button id="closeBtn" class="btn">Stäng</button>
                </div>
            </div>
        </div>

        <!-- Final Jeopardy Modal -->
        <div id="finalModal" class="modal hidden">
            <div class="modal-content final-modal">
                <h2>FINAL JEOPARDY!</h2>
                <div class="final-category" id="finalCategory"></div>
                <div class="final-section">
                    <h3>Spelare, placera era insatser!</h3>
                    <div class="final-wagers">
                        <div class="wager-input">
                            <label>Spelare 1:</label>
                            <input type="number" id="wager1" min="0">
                        </div>
                        <div class="wager-input">
                            <label>Spelare 2:</label>
                            <input type="number" id="wager2" min="0">
                        </div>
                        <div class="wager-input">
                            <label>Spelare 3:</label>
                            <input type="number" id="wager3" min="0">
                        </div>
                        <div class="wager-input">
                            <label>Spelare 4:</label>
                            <input type="number" id="wager4" min="0">
                        </div>
                    </div>
                    <button id="showFinalQuestionBtn" class="btn">Visa fråga</button>
                </div>
                <div class="final-question hidden" id="finalQuestionSection">
                    <div class="question-text" id="finalQuestionText"></div>
                    <button id="showFinalAnswerBtn" class="btn">Visa svar</button>
                </div>
                <div class="final-answer hidden" id="finalAnswerSection">
                    <div class="question-answer" id="finalAnswerText"></div>
                    <h3>Markera vilka som svarade rätt:</h3>
                    <div class="final-results">
                        <label><input type="checkbox" id="finalCorrect1"> Spelare 1</label>
                        <label><input type="checkbox" id="finalCorrect2"> Spelare 2</label>
                        <label><input type="checkbox" id="finalCorrect3"> Spelare 3</label>
                        <label><input type="checkbox" id="finalCorrect4"> Spelare 4</label>
                    </div>
                    <button id="finishGameBtn" class="btn">Avsluta spel</button>
                </div>
            </div>
        </div>

        <!-- Vinnare Modal -->
        <div id="winnerModal" class="modal hidden">
            <div class="modal-content">
                <h2>🎉 SPELET ÄR SLUT! 🎉</h2>
                <div id="winnerText"></div>
                <button id="newGameBtn" class="btn">Nytt spel</button>
            </div>
        </div>
    </div>

    <script src="questions.js"></script>
    <script src="game.js"></script>
</body>
</html>
